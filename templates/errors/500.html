<!-- templates/errors/500.html -->
{% extends "base.html" %}

{% block title %}Erro Interno – MultiSoluções{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body p-5">
                    <i class="fas fa-times-circle fa-5x text-danger mb-4"></i>
                    <h2 class="text-danger mb-3">Erro Interno</h2>
                    <p class="lead">Ocorreu um erro ao processar sua solicitação.</p>
                    <p class="text-muted">Nossa equipe foi notificada e está trabalhando para resolver o problema.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('home.index') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Voltar ao Início
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
