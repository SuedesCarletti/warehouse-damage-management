<!-- templates/errors/404.html -->
{% extends "base.html" %}

{% block title %}Página não encontrada – MultiSoluções{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body p-5">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                    <h2 class="text-warning mb-3">Página Não Encontrada</h2>
                    <p class="lead">A página que você procura não existe.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('home.index') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Voltar ao Início
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
