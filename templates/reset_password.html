{% extends "base.html" %}

{% block title %}Crie uma Nova Senha - Plataforma Multi-Soluções{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 col-lg-5">
            <div class="card fade-in">
                <div class="card-header text-center">
                    <h3><i class="fas fa-lock me-2"></i>Crie uma Nova Senha</h3>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="token" value="{{ token }}">
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Nova Senha (mínimo 8 caracteres)</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="8">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password_confirm" class="form-label">Confirme a Nova Senha</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" required minlength="8">
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save me-2"></i>Salvar Nova Senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
