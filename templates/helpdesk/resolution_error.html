<!-- templates/resolution_error.html -->
{% extends "base.html" %}

{% block title %}Erro - Sistema de Chamados TI{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body p-5">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                    <h2 class="text-warning mb-3">Link Inválido</h2>
                    <p class="lead">
                        Este link de resolução é inválido ou já foi utilizado.
                    </p>
                    <p class="text-muted">
                        Se você acredita que isso seja um erro, entre em contato com o suporte.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
